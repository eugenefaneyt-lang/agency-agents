<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Master Gradients -->
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    :root {
      --focus-outline: #0F172A;
    }
    /* Styling for dark/light mode responsiveness */
    .text-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: 1.2px;
    }
    
    .text-subtitle {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.8px;
      fill: #4B5563;
    }

    .bg-grid {
      stroke: rgba(156, 163, 175, 0.1);
      stroke-width: 1;
    }

    .circuit-line {
      stroke: #8B5CF6;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.8;
    }

    .circuit-line-accent {
      stroke: #00F2FE;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: url(#glow-cyan);
    }

    .circuit-line-pink {
      stroke: #EC4899;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: url(#glow-pink);
    }

    .node {
      transition: all 0.3s ease;
    }

    .node:hover, .node:focus {
      transform: scale(1.3);
      outline: 2px solid var(--focus-outline);
      outline-offset: 3px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --focus-outline: #00F2FE;
      }
      .text-subtitle {
        fill: #9CA3AF;
      }
      }
      .bg-grid {
        stroke: rgba(255, 255, 255, 0.05);
      }
    }
  </style>

  <!-- Optional Background Grid for Tech Vibe -->
  <g class="bg-grid">
    <line x1="20" y1="50" x2="210" y2="50" />
    <line x1="20" y1="100" x2="210" y2="100" />
    <line x1="20" y1="150" x2="210" y2="150" />
    <line x1="20" y1="200" x2="210" y2="200" />
    <line x1="50" y1="20" x2="50" y2="230" />
    <line x1="100" y1="20" x2="100" y2="230" />
    <line x1="150" y1="20" x2="150" y2="230" />
    <line x1="200" y1="20" x2="200" y2="230" />
  </g>

  <!-- ==================== ICON GROUP ==================== -->
  <g transform="translate(10, 0)">
    
    <!-- Ambient Connection Lines Behind Mask -->
    <path d="M 45 70 L 65 110 M 50 170 L 55 155 M 205 75 L 175 110 M 210 160 L 165 180" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Left Side: Solid Mask (Human / Persona / Creative) -->
    <path d="M 120 45 C 95 45 65 75 65 110 C 65 125 55 140 55 155 C 55 175 80 205 120 205 L 120 45 Z" 
          fill="url(#grad-primary)" 
          fill-opacity="0.9" />

    <!-- Left Smiling Eye Cutout (Glowing Cyan) -->
    <path d="M 80 115 Q 92 100 104 115 Q 92 108 80 115 Z" 
          fill="#00F2FE" 
          filter="url(#glow-cyan)" />

    <!-- Left Smiling Mouth Cutout (Glowing Cyan) -->
    <path d="M 120 175 Q 100 175 90 165 Q 100 185 120 185 Z" 
          fill="#00F2FE" 
          filter="url(#glow-cyan)" />

    <!-- Right Side: Cyber Mesh / Neural Network (AI / Automation) -->
    <!-- Base outline circuit -->
    <path class="circuit-line-accent" d="M 120 45 L 160 65 L 175 110 L 185 140 L 165 180 L 140 200 L 120 205" />
    
    <!-- Internal neural paths -->
    <path class="circuit-line" d="M 120 85 L 140 85 L 160 65" />
    <path class="circuit-line" d="M 140 85 L 150 115 L 175 110" />
    <path class="circuit-line-pink" d="M 120 130 L 150 115" />
    <path class="circuit-line" d="M 150 115 L 155 145 L 185 140" />
    <path class="circuit-line-pink" d="M 120 175 L 155 145 L 165 180" />
    <path class="circuit-line" d="M 155 145 L 140 200" />

    <!-- Central Divider Glow -->
    <line x1="120" y1="45" x2="120" y2="205" stroke="url(#grad-accent)" stroke-width="2" opacity="0.7" />

    <!-- Network Nodes (Vertices) -->
    <!-- Node A: Right Temple -->
    <circle class="node" cx="160" cy="65" r="5" fill="#8B5CF6" filter="url(#glow-purple)" />
    <!-- Node B: Upper Right Cheek -->
    <circle class="node" cx="175" cy="110" r="4" fill="#3B82F6" />
    <!-- Node C: Cheek Indentation -->
    <circle class="node" cx="185" cy="140" r="6" fill="#00F2FE" filter="url(#glow-cyan)" />
    <!-- Node D: Lower Right Jaw -->
    <circle class="node" cx="165" cy="180" r="5" fill="#8B5CF6" />
    <!-- Node E: Chin/Bottom -->
    <circle class="node" cx="140" cy="200" r="4.5" fill="#3B82F6" />
    
    <!-- Internal Nodes -->
    <!-- Node F: Brain/Forehead -->
    <circle class="node" cx="140" cy="85" r="4" fill="#00F2FE" />
    <!-- Node G: Cyber Right Eye (glowing pink) -->
    <circle class="node" cx="150" cy="115" r="7" fill="#EC4899" filter="url(#glow-pink)" />
    <!-- Node H: Cyber Mouth Corner -->
    <circle class="node" cx="155" cy="145" r="5" fill="#EC4899" filter="url(#glow-pink)" />

    <!-- External Floating Agent Nodes (Representing diverse active agents) -->
    <circle class="node" cx="45" cy="70" r="3" fill="#00F2FE" filter="url(#glow-cyan)" />
    <circle class="node" cx="50" cy="170" r="4" fill="#8B5CF6" />
    <circle class="node" cx="205" cy="75" r="4.5" fill="#EC4899" filter="url(#glow-pink)" />
    <circle class="node" cx="210" cy="160" r="3" fill="#00F2FE" filter="url(#glow-cyan)" />
    <circle class="node" cx="130" cy="25" r="2.5" fill="#3B82F6" />
    <circle class="node" cx="110" cy="225" r="3" fill="#EC4899" />
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <g transform="translate(250, 0)">
    <!-- Main Title -->
    <text x="0" y="125" class="text-title" fill="url(#grad-text)">THE AGENCY</text>
    
    <!-- Subtitle -->
    <text x="5" y="170" class="text-subtitle">AI SPECIALIST NETWORK</text>
  </g>
</svg>
